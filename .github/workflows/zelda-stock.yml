name: Zelda 40th Anniversary Stock Checker

on:
  schedule:
    # GitHub's shortest scheduled interval is 5 minutes.
    # This job checks again at +2 and +4 minutes.
    - cron: "1/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zelda-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Playwright Core
        run: |
          npm install --no-save --no-audit --no-fund playwright-core

      - name: Test phone notification
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            --fail \
            -H "Title: Zelda Stock Monitor TEST" \
            -H "Priority: high" \
            -H "Tags: white_check_mark,video_game" \
            -d "Test successful. Your Zelda Nintendo stock alerts are working." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Monitor Nintendo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright-core");
          const { execSync } = require("child_process");
          const fs = require("fs");

          const PRODUCTS = [
            {
              id: "zelda-switch-2",
              name: "Zelda 40th Anniversary Nintendo Switch 2",
              shortName: "ZELDA SWITCH 2",
              sku: "121642",
              url:
                "https://www.nintendo.com/us/store/products/nintendo-switch-2-the-legend-of-zelda-40th-anniversary-edition-121642/",
            },

            {
              id: "zelda-pro-controller",
              name: "Zelda 40th Anniversary Pro Controller + Display Stand",
              shortName: "ZELDA PRO CONTROLLER",
              sku: "127076",
              url:
                "https://www.nintendo.com/us/store/products/nintendo-switch-2-pro-controller-display-stand-the-legend-of-zelda-40th-anniversary-edition-127076/",
            },
          ];

          const STATE_FILE = ".stock-state.json";

          /*
           * GitHub launches the workflow every ~5 minutes.
           *
           * Scheduled run:
           * Check 1: immediately
           * Check 2: +2 minutes
           * Check 3: +4 minutes
           *
           * Manual test:
           * One check only.
           */
          const CHECK_INTERVAL_MS = 2 * 60 * 1000;

          const CHECK_COUNT =
            process.env.MANUAL_RUN === "true"
              ? 1
              : 3;

          /*
           * Extra reminder schedule after initial restock alert.
           */
          const REMINDER_MINUTES = [
            7,
            15,
            30,
          ];

          function sleep(ms) {
            return new Promise((resolve) =>
              setTimeout(resolve, ms)
            );
          }

          /*
           * Expected state structure:
           *
           * {
           *   "zelda-switch-2": {
           *     "inStock": false,
           *     "firstSeenAt": null,
           *     "remindersSent": []
           *   }
           * }
           */
          let state = {};

          let stateDirty = false;

          try {
            if (fs.existsSync(STATE_FILE)) {
              state = JSON.parse(
                fs.readFileSync(
                  STATE_FILE,
                  "utf8"
                )
              );
            }
          } catch (error) {
            console.log(
              "Could not read previous state."
            );

            state = {};
          }

          /*
           * Initialize missing product state.
           */
          for (const product of PRODUCTS) {
            if (
              !state[product.id] ||
              typeof state[product.id] !== "object"
            ) {
              state[product.id] = {
                inStock: false,
                firstSeenAt: null,
                remindersSent: [],
              };

              stateDirty = true;
            }

            if (
              !Array.isArray(
                state[product.id].remindersSent
              )
            ) {
              state[product.id].remindersSent = [];
              stateDirty = true;
            }
          }

          function saveState() {
            if (!stateDirty) {
              return;
            }

            fs.writeFileSync(
              STATE_FILE,
              JSON.stringify(
                state,
                null,
                2
              ) + "\n"
            );

            console.log(
              "State saved:"
            );

            console.log(
              JSON.stringify(
                state,
                null,
                2
              )
            );

            stateDirty = false;
          }

          /*
           * Send an ntfy notification.
           */
          async function sendNotification({
            title,
            body,
            url,
            priority = "urgent",
            tags = "rotating_light,video_game",
          }) {
            if (!process.env.NTFY_TOPIC) {
              throw new Error(
                "NTFY_TOPIC secret is missing."
              );
            }

            const response = await fetch(
              `https://ntfy.sh/${process.env.NTFY_TOPIC}`,
              {
                method: "POST",

                headers: {
                  Title: title,
                  Priority: priority,
                  Tags: tags,
                  Click: url,
                },

                body,
              }
            );

            if (!response.ok) {
              throw new Error(
                `ntfy failed: ${response.status}`
              );
            }
          }

          /*
           * Three immediate notifications when stock first appears.
           */
          async function sendInitialStockBurst(
            product,
            detectedText
          ) {
            console.log("");
            console.log(
              `🚨🚨🚨 ${product.name} RESTOCK DETECTED 🚨🚨🚨`
            );

            for (let i = 1; i <= 3; i++) {
              await sendNotification({
                title:
                  `🚨 ${product.shortName} IN STOCK (${i}/3)`,

                body:
                  `${product.name} appears to be BACK IN STOCK!\n\n` +
                  `Nintendo is showing: ${detectedText}\n\n` +
                  `BUY IT NOW:\n${product.url}`,

                url: product.url,

                priority: "urgent",

                tags:
                  "rotating_light,rotating_light,video_game",
              });

              console.log(
                `Immediate alert ${i}/3 sent.`
              );

              /*
               * Make sure the phone sees these as
               * separate pushes.
               */
              if (i < 3) {
                await sleep(3000);
              }
            }
          }

          /*
           * Additional reminder if the item remains available.
           */
          async function sendReminder(
            product,
            minutes
          ) {
            let title;

            if (minutes === 7) {
              title =
                `⏰ ${product.shortName} STILL IN STOCK`;
            } else if (minutes === 15) {
              title =
                `🚨 DON'T MISS IT — ${product.shortName}`;
            } else {
              title =
                `⚠️ FINAL REMINDER — ${product.shortName}`;
            }

            await sendNotification({
              title,

              body:
                `${product.name} is STILL showing as available approximately ${minutes} minutes after the restock was detected.\n\n` +
                `BUY NOW:\n${product.url}`,

              url: product.url,

              priority: "urgent",

              tags:
                "alarm_clock,rotating_light,video_game",
            });

            console.log(
              `${minutes}-minute reminder sent for ${product.name}.`
            );
          }

          /*
           * Check whether reminders are due.
           */
          async function processReminders(
            product
          ) {
            const productState =
              state[product.id];

            if (
              !productState.inStock ||
              !productState.firstSeenAt
            ) {
              return;
            }

            const firstSeen =
              new Date(
                productState.firstSeenAt
              ).getTime();

            const elapsedMinutes =
              (Date.now() - firstSeen) /
              60000;

            console.log(
              `${product.name} has been in stock for approximately ${elapsedMinutes.toFixed(
                1
              )} minutes.`
            );

            for (
              const reminderMinutes
              of REMINDER_MINUTES
            ) {
              const alreadySent =
                productState.remindersSent.includes(
                  reminderMinutes
                );

              if (
                elapsedMinutes >= reminderMinutes &&
                !alreadySent
              ) {
                await sendReminder(
                  product,
                  reminderMinutes
                );

                productState.remindersSent.push(
                  reminderMinutes
                );

                stateDirty = true;

                /*
                 * Save immediately after each reminder
                 * so we don't deliberately send it twice
                 * during this workflow run.
                 */
                saveState();
              }
            }
          }

          /*
           * Inspect one Nintendo product page.
           */
          async function checkProduct(
            browser,
            product,
            cycle
          ) {
            console.log("");
            console.log(
              "===================================================="
            );

            console.log(
              product.name
            );

            console.log(
              `SKU: ${product.sku}`
            );

            console.log(
              `Cycle: ${cycle}/${CHECK_COUNT}`
            );

            console.log(
              `Time: ${new Date().toISOString()}`
            );

            console.log(
              "===================================================="
            );

            const page =
              await browser.newPage({
                userAgent:
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                  "AppleWebKit/537.36 (KHTML, like Gecko) " +
                  "Chrome/152 Safari/537.36",
              });

            try {
              console.log(
                "Opening Nintendo..."
              );

              await page.goto(
                product.url,
                {
                  waitUntil:
                    "domcontentloaded",

                  timeout: 60000,
                }
              );

              /*
               * Nintendo's purchase section is loaded
               * dynamically.
               *
               * Wait until one of the known purchase
               * states appears.
               */
              try {
                await page.waitForFunction(
                  () => {
                    const elements =
                      Array.from(
                        document.querySelectorAll(
                          "button, a"
                        )
                      );

                    return elements.some(
                      (element) => {
                        const text =
                          (
                            element.innerText ||
                            element.textContent ||
                            ""
                          )
                            .trim()
                            .replace(
                              /\s+/g,
                              " "
                            )
                            .toLowerCase();

                        return (
                          text ===
                            "sold out" ||

                          text ===
                            "add to cart" ||

                          text ===
                            "add to bag" ||

                          text ===
                            "pre-order" ||

                          text ===
                            "preorder" ||

                          text ===
                            "pre-order now" ||

                          text ===
                            "preorder now" ||

                          text ===
                            "buy now" ||

                          text ===
                            "purchase now"
                        );
                      }
                    );
                  },

                  {
                    timeout: 20000,
                  }
                );
              } catch {
                console.log(
                  "Purchase widget did not resolve within 20 seconds."
                );
              }

              /*
               * Small hydration buffer.
               */
              await page.waitForTimeout(
                1200
              );

              const controls =
                await page
                  .locator(
                    "button:visible, a:visible"
                  )
                  .evaluateAll(
                    (elements) =>
                      elements.map(
                        (element) => ({
                          text:
                            (
                              element.innerText ||
                              element.textContent ||
                              ""
                            )
                              .trim()
                              .replace(
                                /\s+/g,
                                " "
                              ),

                          disabled:
                            element.disabled ===
                              true ||

                            element.getAttribute(
                              "aria-disabled"
                            ) ===
                              "true",
                        })
                      )
                  );

              const relevantControls =
                controls.filter(
                  (control) =>
                    /cart|bag|order|buy|purchase|retailer|sold/i.test(
                      control.text
                    )
                );

              console.log(
                "Relevant Nintendo controls:"
              );

              console.log(
                relevantControls
              );

              /*
               * Exact-ish purchasing controls.
               *
               * This deliberately avoids false positives
               * such as:
               *
               * "How to buy Nintendo Switch 2"
               * "Find retailers"
               * "Order status"
               */
              const purchaseRegex =
                /^(add to cart|add to bag|pre[- ]?order(?: now)?|buy now|purchase now)$/i;

              const activePurchaseControl =
                controls.find(
                  (control) =>
                    purchaseRegex.test(
                      control.text
                    ) &&
                    !control.disabled
                );

              if (
                activePurchaseControl
              ) {
                console.log(
                  `🚨 ACTIVE PURCHASE CONTROL FOUND: "${activePurchaseControl.text}"`
                );

                return {
                  status: "in_stock",
                  detectedText:
                    activePurchaseControl.text,
                };
              }

              /*
               * Explicit sold-out button.
               */
              const soldOutControl =
                controls.find(
                  (control) =>
                    /^sold out$/i.test(
                      control.text
                    )
                );

              if (soldOutControl) {
                console.log(
                  'Nintendo shows "Sold out".'
                );

                return {
                  status:
                    "out_of_stock",
                };
              }

              /*
               * Secondary unavailable checks.
               */
              const bodyText =
                await page
                  .locator("body")
                  .innerText();

              if (
                /\b(out of stock|currently unavailable)\b/i.test(
                  bodyText
                )
              ) {
                console.log(
                  "Nintendo shows unavailable text."
                );

                return {
                  status:
                    "out_of_stock",
                };
              }

              /*
               * Important:
               *
               * If Nintendo changes the page and we don't
               * understand the state, DON'T send an alert
               * and DON'T reset an existing stock state.
               */
              console.log(
                "Could not safely determine stock state."
              );

              return {
                status: "unknown",
              };

            } catch (error) {
              console.error(
                `Error checking ${product.name}:`,
                error
              );

              return {
                status: "unknown",
              };

            } finally {
              if (!page.isClosed()) {
                await page.close();
              }
            }
          }

          /*
           * Main monitoring loop.
           */
          (async () => {
            let chromePath;

            try {
              chromePath =
                execSync(
                  "which google-chrome || which chromium || which chromium-browser"
                )
                  .toString()
                  .trim();

            } catch {
              throw new Error(
                "Chrome could not be found on this GitHub runner."
              );
            }

            console.log(
              `Using Chrome: ${chromePath}`
            );

            console.log(
              `Monitoring ${PRODUCTS.length} Zelda products.`
            );

            const browser =
              await chromium.launch({
                headless: true,

                executablePath:
                  chromePath,

                args: [
                  "--no-sandbox",
                  "--disable-dev-shm-usage",
                ],
              });

            const monitoringStarted =
              Date.now();

            try {
              for (
                let cycle = 1;
                cycle <= CHECK_COUNT;
                cycle++
              ) {
                /*
                 * Keep cycle timing anchored:
                 *
                 * cycle 1 = 0 min
                 * cycle 2 = 2 min
                 * cycle 3 = 4 min
                 */
                if (cycle > 1) {
                  const target =
                    monitoringStarted +
                    (cycle - 1) *
                      CHECK_INTERVAL_MS;

                  const waitTime =
                    Math.max(
                      0,
                      target -
                        Date.now()
                    );

                  console.log("");
                  console.log(
                    `Waiting approximately ${Math.round(
                      waitTime /
                        1000
                    )} seconds for next cycle...`
                  );

                  await sleep(
                    waitTime
                  );
                }

                console.log("");
                console.log(
                  `========== CHECK CYCLE ${cycle}/${CHECK_COUNT} ==========`
                );

                for (
                  const product
                  of PRODUCTS
                ) {
                  const result =
                    await checkProduct(
                      browser,
                      product,
                      cycle
                    );

                  const productState =
                    state[
                      product.id
                    ];

                  /*
                   * PRODUCT IS AVAILABLE
                   */
                  if (
                    result.status ===
                    "in_stock"
                  ) {
                    /*
                     * Fresh restock.
                     */
                    if (
                      !productState.inStock
                    ) {
                      console.log(
                        `🚨 NEW RESTOCK: ${product.name}`
                      );

                      /*
                       * Record the restock immediately.
                       */
                      productState.inStock =
                        true;

                      productState.firstSeenAt =
                        new Date().toISOString();

                      productState.remindersSent =
                        [];

                      stateDirty =
                        true;

                      saveState();

                      await sendInitialStockBurst(
                        product,
                        result.detectedText
                      );
                    } else {
                      console.log(
                        `${product.name} remains in stock.`
                      );
                    }

                    /*
                     * See whether 7/15/30 minute
                     * reminder is due.
                     */
                    await processReminders(
                      product
                    );
                  }

                  /*
                   * PRODUCT IS SOLD OUT
                   */
                  else if (
                    result.status ===
                    "out_of_stock"
                  ) {
                    if (
                      productState.inStock
                    ) {
                      console.log(
                        `${product.name} has sold out again. Resetting restock state.`
                      );

                      productState.inStock =
                        false;

                      productState.firstSeenAt =
                        null;

                      productState.remindersSent =
                        [];

                      stateDirty =
                        true;

                      saveState();
                    } else {
                      console.log(
                        `${product.name} is still unavailable.`
                      );
                    }
                  }

                  /*
                   * UNKNOWN STATE
                   */
                  else {
                    console.log(
                      `${product.name}: UNKNOWN state. Previous state will remain unchanged.`
                    );
                  }
                }

                saveState();
              }

            } finally {
              await browser.close();
            }

            saveState();

            console.log("");
            console.log(
              "Monitoring run complete."
            );

          })().catch(
            (error) => {
              saveState();

              console.error(
                error
              );

              process.exit(1);
            }
          );
          EOF

          node check.js

      - name: Save stock state
        run: |
          if [ -n "$(git status --porcelain .stock-state.json)" ]; then

            git config user.name "zelda-stock-bot"
            git config user.email "zelda-stock-bot@users.noreply.github.com"

            git add .stock-state.json

            git commit \
              -m "Update Zelda stock state"

            # In case you edited the repo while the monitor
            # was running, rebase before pushing.
            git pull \
              --rebase \
              origin \
              "$GITHUB_REF_NAME"

            git push origin HEAD:"$GITHUB_REF_NAME"

          else
            echo "No stock-state change to save."
          fi
