name: Zelda Switch 2 Stock Checker

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # This runs ONLY when you manually click "Run workflow".
      # It does NOT run during the automatic 5-minute checks.
      - name: Test phone notification
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: Zelda Stock Monitor Test" \
            -H "Priority: high" \
            -H "Tags: video_game" \
            -d "Your Zelda stock alerts are working." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Check Nintendo stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright");

          const url =
            "https://www.nintendo.com/us/store/products/nintendo-switch-2-the-legend-of-zelda-40th-anniversary-edition-121642/";

          (async () => {
            const browser = await chromium.launch({
              headless: true,
            });

            const page = await browser.newPage({
              userAgent:
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
            });

            console.log("Opening Nintendo...");

            await page.goto(url, {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });

            // Give Nintendo's JavaScript purchase widget time to load
            await page.waitForTimeout(12000);

            const bodyText = await page.locator("body").innerText();

            console.log("Page loaded.");

            const purchaseRegex =
              /\b(add to cart|add to bag|pre[- ]?order|buy now|purchase now)\b/i;

            const unavailableRegex =
              /\b(sold out|out of stock|currently unavailable)\b/i;

            const buttons = await page
              .locator("button, a")
              .evaluateAll((els) =>
                els.map((el) => ({
                  text: (el.innerText || el.textContent || "").trim(),
                  disabled:
                    el.disabled ||
                    el.getAttribute("aria-disabled") === "true",
                }))
              );

            const relevantControls = buttons
              .filter((b) =>
                /cart|order|buy|purchase|retailer|sold/i.test(b.text)
              )
              .slice(0, 30);

            console.log("Relevant controls:", relevantControls);

            const activePurchaseControl = buttons.find(
              (b) =>
                purchaseRegex.test(b.text) &&
                !b.disabled
            );

            const unavailable =
              unavailableRegex.test(bodyText);

            if (activePurchaseControl && !unavailable) {
              console.log(
                "🚨 STOCK DETECTED:",
                activePurchaseControl.text
              );

              const response = await fetch(
                `https://ntfy.sh/${process.env.NTFY_TOPIC}`,
                {
                  method: "POST",
                  headers: {
                    Title: "🚨 ZELDA SWITCH 2 IN STOCK",
                    Priority: "urgent",
                    Tags: "rotating_light,video_game",
                    Click: url,
                  },
                  body:
                    `Nintendo's Zelda 40th Anniversary Switch 2 appears to be available!\n\n` +
                    `Detected: ${activePurchaseControl.text}\n\n` +
                    `BUY NOW: ${url}`,
                }
              );

              if (!response.ok) {
                throw new Error(
                  `ntfy notification failed: ${response.status}`
                );
              }

              console.log("🚨 Phone notification sent!");
            } else {
              console.log("Still unavailable.");
            }

            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node check.js
