name: Zelda Switch 2 Stock Checker

on:
  schedule:
    # GitHub's minimum cron interval is 5 minutes.
    # We start at minute 1 to avoid the busiest top-of-hour period.
    - cron: "1/5 * * * *"

  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install lightweight Playwright library
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.63.0

      - name: Test phone notification
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: Zelda Stock Monitor Test" \
            -H "Priority: high" \
            -H "Tags: video_game" \
            -d "Your Zelda stock alerts are working." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Monitor Nintendo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright-core");
          const { execSync } = require("child_process");

          const PRODUCT_URL =
            "https://www.nintendo.com/us/store/products/nintendo-switch-2-the-legend-of-zelda-40th-anniversary-edition-121642/";

          const CHECK_INTERVAL = 2 * 60 * 1000;

          // Manual runs do one check.
          // Scheduled runs do three checks:
          // ~0 minutes, ~2 minutes, ~4 minutes.
          const CHECK_COUNT =
            process.env.MANUAL_RUN === "true" ? 1 : 3;

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          async function sendStockAlerts(detectedText) {
            console.log("🚨 SENDING 3 STOCK ALERTS 🚨");

            for (let i = 1; i <= 3; i++) {
              const response = await fetch(
                `https://ntfy.sh/${process.env.NTFY_TOPIC}`,
                {
                  method: "POST",

                  headers: {
                    Title: `🚨 ZELDA SWITCH 2 IN STOCK (${i}/3)`,
                    Priority: "urgent",
                    Tags: "rotating_light,video_game",
                    Click: PRODUCT_URL,
                  },

                  body:
                    `THE ZELDA 40TH ANNIVERSARY SWITCH 2 APPEARS TO BE BACK IN STOCK!\n\n` +
                    `Nintendo is showing: ${detectedText}\n\n` +
                    `BUY IT NOW:\n${PRODUCT_URL}`,
                }
              );

              if (!response.ok) {
                throw new Error(
                  `ntfy notification ${i} failed: ${response.status}`
                );
              }

              console.log(`Stock notification ${i}/3 sent.`);

              // Separate the notifications slightly so the phone
              // receives three distinct alerts.
              if (i < 3) {
                await sleep(2500);
              }
            }

            console.log("🚨 ALL 3 ALERTS SENT 🚨");
          }

          async function checkNintendo(browser, checkNumber) {
            console.log("");
            console.log("====================================");
            console.log(
              `Nintendo stock check ${checkNumber}/${CHECK_COUNT}`
            );
            console.log(
              `Time: ${new Date().toISOString()}`
            );
            console.log("====================================");

            const page = await browser.newPage({
              userAgent:
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                "AppleWebKit/537.36 (KHTML, like Gecko) " +
                "Chrome/152 Safari/537.36",
            });

            try {
              console.log("Opening Nintendo...");

              await page.goto(PRODUCT_URL, {
                waitUntil: "domcontentloaded",
                timeout: 60000,
              });

              /*
               * Nintendo loads the purchase controls with JavaScript.
               * Wait until we see one of the relevant purchasing states
               * rather than blindly waiting a fixed amount of time.
               */
              try {
                await page.waitForFunction(
                  () => {
                    const text =
                      document.body?.innerText?.toLowerCase() || "";

                    return (
                      text.includes("sold out") ||
                      text.includes("add to cart") ||
                      text.includes("add to bag") ||
                      text.includes("pre-order") ||
                      text.includes("preorder") ||
                      text.includes("buy now") ||
                      text.includes("purchase now")
                    );
                  },
                  {
                    timeout: 20000,
                  }
                );
              } catch {
                console.log(
                  "Purchase widget did not resolve within 20 seconds."
                );
              }

              // Small buffer after Nintendo's widget appears.
              await page.waitForTimeout(1500);

              const controls = await page
                .locator("button:visible, a:visible")
                .evaluateAll((elements) =>
                  elements.map((element) => ({
                    text:
                      (
                        element.innerText ||
                        element.textContent ||
                        ""
                      ).trim(),

                    disabled:
                      element.disabled === true ||
                      element.getAttribute("aria-disabled") === "true",
                  }))
                );

              const relevantControls = controls
                .filter(control =>
                  /cart|bag|order|buy|purchase|retailer|sold/i.test(
                    control.text
                  )
                )
                .slice(0, 40);

              console.log(
                "Relevant controls:",
                relevantControls
              );

              /*
               * We deliberately look for an ACTIVE purchase control.
               *
               * This avoids false positives such as:
               * "How to buy Nintendo Switch 2"
               * "Order status"
               * "Find retailers"
               */
              const purchaseRegex =
                /\b(add to cart|add to bag|pre[- ]?order(?: now)?|buy now|purchase now)\b/i;

              const activePurchaseControl = controls.find(
                control =>
                  purchaseRegex.test(control.text) &&
                  !control.disabled &&
                  control.text.length < 100
              );

              if (activePurchaseControl) {
                console.log("");
                console.log(
                  `🚨🚨🚨 STOCK DETECTED: "${activePurchaseControl.text}" 🚨🚨🚨`
                );

                await sendStockAlerts(
                  activePurchaseControl.text
                );

                await page.close();

                return true;
              }

              const soldOutControl = controls.find(
                control =>
                  /\bsold out\b/i.test(control.text)
              );

              if (soldOutControl) {
                console.log(
                  `Still sold out. Control found: "${soldOutControl.text}"`
                );
              } else {
                console.log(
                  "No active purchasing button detected."
                );
              }

              return false;

            } catch (error) {
              console.error(
                "Error during Nintendo check:",
                error
              );

              // Don't treat a temporary Nintendo/network error
              // as being in stock.
              return false;

            } finally {
              if (!page.isClosed()) {
                await page.close();
              }
            }
          }

          (async () => {
            /*
             * GitHub's Ubuntu runner already contains Chrome.
             * Find it instead of downloading another browser.
             */
            let chromePath;

            try {
              chromePath = execSync(
                "which google-chrome || which chromium || which chromium-browser"
              )
                .toString()
                .trim();
            } catch {
              throw new Error(
                "Could not locate Chrome on the GitHub runner."
              );
            }

            console.log(`Using existing Chrome: ${chromePath}`);

            const browser = await chromium.launch({
              headless: true,
              executablePath: chromePath,

              args: [
                "--no-sandbox",
                "--disable-dev-shm-usage",
              ],
            });

            const monitoringStarted = Date.now();

            try {
              for (
                let checkNumber = 1;
                checkNumber <= CHECK_COUNT;
                checkNumber++
              ) {
                /*
                 * Anchor checks to the start of the workflow so
                 * they're approximately:
                 *
                 * Check 1 = 0:00
                 * Check 2 = 2:00
                 * Check 3 = 4:00
                 */
                if (checkNumber > 1) {
                  const targetTime =
                    monitoringStarted +
                    (checkNumber - 1) * CHECK_INTERVAL;

                  const waitTime =
                    Math.max(0, targetTime - Date.now());

                  console.log("");
                  console.log(
                    `Next Nintendo check in ${Math.round(
                      waitTime / 1000
                    )} seconds...`
                  );

                  await sleep(waitTime);
                }

                const inStock = await checkNintendo(
                  browser,
                  checkNumber
                );

                /*
                 * Once stock is detected and the three alerts
                 * have been sent, there is no reason to perform
                 * the remaining checks in this run.
                 */
                if (inStock) {
                  console.log(
                    "Stock detected — ending this monitoring run."
                  );

                  break;
                }
              }

            } finally {
              await browser.close();
            }

            console.log("");
            console.log("Monitoring run complete.");

          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node check.js
